name: be-spring-ci

# 스프링판 백엔드(BE-spring/) 변경, 또는 함께 쓰는 종단 검증 도구(BE/scripts·BE/mockserver) 변경에 실행
on:
  push:
    paths: ["BE-spring/**", "BE/scripts/e2e_verify.py", "BE/mockserver/**", ".github/workflows/be-spring-ci.yml"]
  pull_request:
    paths: ["BE-spring/**", "BE/scripts/e2e_verify.py", "BE/mockserver/**", ".github/workflows/be-spring-ci.yml"]

# GITHUB_TOKEN 은 읽기 전용 (테스트만 하므로 쓰기 권한 불필요). 비밀값(secrets.*)은 쓰지 않는다
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # 외부 액션은 태그 대신 커밋 SHA 로 고정 (태그를 옮겨 악성 코드를 넣는 공급망 공격 방지)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: 단위·통합 테스트 + 실행 파일
        working-directory: BE-spring
        run: ./gradlew --no-daemon build
      # 종단 검증: 파이썬판과 같은 점검(모의 외부 API + 실제 법령 원문)을 스프링 서버 프로세스에 돌린다
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: 종단 검증 도구 설치 (BE)
        working-directory: BE
        run: python -m pip install -e ".[dev]"
      - name: End-to-end (스프링 + H2, 스레드 실행)
        working-directory: BE
        run: python scripts/e2e_verify.py --server spring --report ../BE-spring/var/e2e_report.json
      - name: End-to-end, 별도 워커 프로세스
        if: runner.os == 'Windows'
        working-directory: BE
        run: python scripts/e2e_verify.py --server spring --executor worker --report ../BE-spring/var/e2e_report_worker.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: be-spring-${{ matrix.os }}
          path: |
            BE-spring/var/e2e_report*.json
            BE-spring/**/build/reports/tests/

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: 실행 파일
        working-directory: BE-spring
        run: ./gradlew --no-daemon :server:bootJar
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - working-directory: BE
        run: python -m pip install -e ".[dev]"
      - name: End-to-end on PostgreSQL (별도 워커)
        working-directory: BE
        env:
          E2E_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
        run: python scripts/e2e_verify.py --server spring --executor worker --report ../BE-spring/var/e2e_report_pg.json
