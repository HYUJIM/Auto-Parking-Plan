name: fe-ci

# 프론트엔드(FE/) 변경에 실행: 타입 검사 + 린트 + 포맷 검사 + 단위 테스트(BE 응답 어댑터·오류 분류·검토 폴링·지도 기하) + 색 코드 직접 입력 검사 + 배포용 빌드
on:
  push:
    paths: ["FE/**", ".github/workflows/fe-ci.yml"]
  pull_request:
    paths: ["FE/**", ".github/workflows/fe-ci.yml"]

# GITHUB_TOKEN 은 읽기 전용. 비밀값(secrets.*)은 쓰지 않는다 — BE 없이도 어댑터 테스트는 저장된 응답 샘플(__fixtures__)로 돈다
permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: FE

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 외부 액션은 태그 대신 커밋 SHA 로 고정 (be-ci.yml 과 같은 규칙)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 버전은 FE/.nvmrc 한 곳에서만 관리 (package.json engines 와 함께)
          node-version-file: FE/.nvmrc
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - name: 의존성 설치 (package-lock.json 그대로, 의존성의 설치 스크립트는 실행하지 않음)
        run: npm ci --ignore-scripts
      - name: 타입 검사 (브라우저 코드 + 설정 파일)
        run: npm run typecheck
      - name: 린트 (ESLint)
        run: npm run lint
      - name: 포맷 검사 (Prettier)
        run: npm run format:check
      - name: 단위 테스트 (BE 응답 어댑터·오류 분류·검토 폴링·지도 기하·저장소 값 검사)
        run: npm test
      - name: 색 코드 직접 입력 검사 (테마 파일 밖 0건)
        run: npm run check:colors
      - name: 배포용 빌드
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: fe-dist
          path: FE/dist
