name: codeql

# 정적 보안 분석(CodeQL): 주입·경로 조작·안전하지 않은 역직렬화 같은 패턴을 코드에서 찾는다.
# main 에 들어오는 변경과 PR 에서 돌고, 새로 알려진 패턴을 잡으려고 주 1회 전체를 다시 본다. 결과는 저장소의 Security 탭에 쌓인다
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 18 * * 0" # 월요일 03:30 KST

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # 분석 결과 업로드
    strategy:
      fail-fast: false
      matrix:
        # build-mode none: 빌드 없이 소스만 분석한다 (자바도 지원). 워크플로 파일 자체도 분석 대상(actions)
        language: [java-kotlin, javascript-typescript, actions]
    steps:
      # 외부 액션은 태그 대신 커밋 SHA 로 고정 (be-ci.yml 과 같은 규칙)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
