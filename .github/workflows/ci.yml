name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit + integration tests
        run: python -m pytest -q
      - name: End-to-end (mock 외부 API + SQLite)
        run: python scripts/e2e_verify.py --report var/e2e_report.json
      - name: End-to-end, 별도 워커 프로세스 (윈도우 기본 콘솔 인코딩 그대로)
        if: runner.os == 'Windows'
        run: python scripts/e2e_verify.py --executor worker --report var/e2e_report_worker.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.os }}-${{ matrix.python }}
          path: var/e2e_report*.json

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: End-to-end on PostgreSQL
        env:
          E2E_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
        run: python scripts/e2e_verify.py --report var/e2e_report_pg.json
