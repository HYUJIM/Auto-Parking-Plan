name: be-ci

# 백엔드(BE/) 변경에만 실행
on:
  push:
    paths: ["BE/**", ".github/workflows/**"]
  pull_request:
    paths: ["BE/**", ".github/workflows/**"]

# GITHUB_TOKEN 은 읽기 전용 (테스트만 하므로 쓰기 권한 불필요). 비밀값(secrets.*)은 쓰지 않는다
permissions:
  contents: read

defaults:
  run:
    working-directory: BE

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # 외부 액션은 태그 대신 커밋 SHA 로 고정 (태그를 옮겨 악성 코드를 넣는 공급망 공격 방지)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit + integration tests
        run: python -m pytest -q
      - name: End-to-end (mock 외부 API + SQLite)
        run: python scripts/e2e_verify.py --report var/e2e_report.json
      - name: End-to-end, 별도 워커 프로세스 (윈도우 기본 콘솔 인코딩 그대로)
        if: runner.os == 'Windows'
        run: python scripts/e2e_verify.py --executor worker --report var/e2e_report_worker.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-${{ matrix.os }}-${{ matrix.python }}
          path: BE/var/e2e_report*.json

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: End-to-end on PostgreSQL
        env:
          E2E_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
        run: python scripts/e2e_verify.py --report var/e2e_report_pg.json
