# 운영 서버(/opt/app)에서 도는 구성: PostgreSQL + API + 프록시.
# 값은 같은 폴더의 .env (scripts/server-env.sh 가 만든다, 권한 600) 에서 읽는다.
# 이미지를 빌드하지 않는다: 공식 JRE 이미지에 release/app.jar 와 release/data 를 읽기 전용으로 붙인다.
name: autoparkingplan

# 컨테이너 로그: 기본 json-file 은 무한히 자란다. 서비스마다 10MB × 5개로 묶어 디스크가 차지 않게 한다
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  image: eclipse-temurin:21-jre
  user: "10001:10001"
  working_dir: /srv/app
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 512
  logging: *logging
  volumes:
    - ./release/app.jar:/srv/app/app.jar:ro
    - ./release/data:/srv/app/data:ro
    - ./blobs:/srv/app/var/blobs
  environment:
    APP_ENV: prod
    APP_HOME: /srv/app
    TZ: Asia/Seoul
    LANG: C.UTF-8
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/tmp"
    DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:?}@db:5432/app
    REVIEW_EXECUTOR: thread
    BLOB_STORE: local
    BLOB_LOCAL_DIR: /srv/app/var/blobs
    # 앞단은 CloudFront 하나 (프록시는 X-Forwarded-For 를 건드리지 않는다)
    TRUSTED_PROXY_HOPS: "1"
    CORS_ORIGINS: ${CORS_ORIGINS:?}
    JUSO_API_KEY: ${JUSO_API_KEY:-}
    VWORLD_API_KEY: ${VWORLD_API_KEY:-}
    VWORLD_DOMAIN: ${VWORLD_DOMAIN:-}
    BUILDING_HUB_KEY: ${BUILDING_HUB_KEY:-}
    LAWGO_OC: ${LAWGO_OC:-}
    LLM_PROVIDER: ${LLM_PROVIDER:-none}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ADMIN_TOKEN: ${ADMIN_TOKEN:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: app
    volumes: ["pgdata:/var/lib/postgresql/data"]
    mem_limit: 512m
    # 진입 스크립트가 데이터 폴더 소유자를 맞추고 postgres 사용자로 내려가는 데 필요한 권한만 남긴다
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    restart: unless-stopped
    command: ["java", "-jar", "/srv/app/app.jar", "serve", "--host", "0.0.0.0", "--port", "8000"]
    mem_limit: 1300m
    # 서버는 종료 신호를 받으면 진행 중인 요청을 최대 20초 마무리한다 (server.shutdown=graceful). Docker 기본 10초면 그 전에 죽인다
    stop_grace_period: 30s
    # 관리자 API 는 인터넷에 열지 않는다: 서버 안 127.0.0.1 에만 (SSH 터널로 접속)
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 4

  # CloudFront 전용 입구: 비밀 헤더가 맞는 /v1, /healthz 요청만 API 로 넘긴다
  # 권한 없는 사용자(uid 101)로 도는 nginx 공식 변형의 안정판. 배포 때마다 pull 하므로 보안 패치가 따라온다
  # (이전의 nginx:1.27-alpine 은 2025-04 이후 갱신이 끊긴 계열이었다). 컨테이너 안에서는 8080 을 듣는다.
  proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    ports: ["80:8080"]
    environment:
      ORIGIN_SECRET: ${ORIGIN_SECRET:?}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    mem_limit: 64m
    read_only: true
    # 템플릿에서 만든 설정(conf.d)과 임시 파일(/tmp: pid·본문 버퍼)만 쓸 수 있다
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    logging: *logging
    depends_on: [api]

  # 최초 1회: 관할 + 법령 원문 + 기록된 추출 결과 적재 (운영이므로 일괄 승인은 하지 않는다)
  #   docker compose run --rm bootstrap
  bootstrap:
    <<: *app
    profiles: ["tools"]
    command: ["java", "-jar", "/srv/app/app.jar", "bootstrap"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
