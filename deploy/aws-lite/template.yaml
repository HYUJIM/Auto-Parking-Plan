AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AutoParkingPlan 소규모 배포 - Lightsail 서버 한 대(BE + PostgreSQL) + S3·CloudFront(FE).
  CloudFront 가 화면(S3)과 API(/v1 -> 서버)를 한 주소로 내보낸다.

Parameters:
  Name:
    Type: String
    Default: autoparkingplan
    AllowedPattern: "^[a-z][a-z0-9-]{2,30}$"
    Description: 자원 이름 접두어
  KeyPairName:
    Type: String
    Description: Lightsail 에 등록한 SSH 키 쌍 이름 (scripts/infra.sh 가 만들어 넘긴다)
  BundleId:
    Type: String
    Default: small_3_0
    Description: Lightsail 요금제 (small_3_0 = 2GB 메모리, 공인 IPv4 포함)
  BlueprintId:
    Type: String
    Default: ubuntu_24_04
  AvailabilityZone:
    Type: String
    Default: ap-northeast-2a
  GitHubRepo:
    Type: String
    Default: HYUJIM/Auto-Parking-Plan
    Description: FE 자동 배포를 허용할 GitHub 저장소 (owner/name)
  GitHubBranch:
    Type: String
    Default: main
  GitHubSubPrefix:
    Type: String
    Default: ""
    Description: >-
      GitHub OIDC 토큰의 sub 앞부분. 저장소가 고유 번호가 들어간 새 형식(repo:OWNER@번호/NAME@번호)을 쓰면 그 값을 넣는다
      (gh api repos/OWNER/NAME/actions/oidc/customization/sub 의 sub_claim_prefix). 비우면 repo:OWNER/NAME
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: 계정에 GitHub OIDC 공급자가 이미 있으면 false

  BudgetEmail:
    Type: String
    Default: ""
    Description: 월 예산 알림을 받을 이메일. 비우면 예산을 만들지 않는다 (scripts/infra.sh 의 BUDGET_EMAIL)
  BudgetLimitUsd:
    Type: Number
    Default: 30
    MinValue: 1
    Description: 월 예산 (USD). 50%·80%·100% 와 예상 초과 때 알림

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]
  CreateBudget: !Not [!Equals [!Ref BudgetEmail, ""]]
  DefaultSubPrefix: !Equals [!Ref GitHubSubPrefix, ""]

Resources:
  # ── 서버 (BE + PostgreSQL, docker compose) ─────────────────────────────
  # DB 가 이 서버의 디스크에 있다. 스택을 지우거나 교체가 필요한 속성(요금제·이미지·이름)을 바꿔도 서버를 지우지 않는다 —
  # 교체가 필요한 변경은 같은 이름의 서버가 남아 있어 실패하고 되돌려진다 (의도한 안전장치. 옮길 때는 스냅샷으로 새 서버를 만든다)
  Instance:
    Type: AWS::Lightsail::Instance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      InstanceName: !Sub "${Name}-server"
      AvailabilityZone: !Ref AvailabilityZone
      BlueprintId: !Ref BlueprintId
      BundleId: !Ref BundleId
      KeyPairName: !Ref KeyPairName
      Networking:
        Ports:
          # 22: 배포(SSH, 키 인증만). 80: CloudFront 전용 - 프록시가 비밀 헤더 없는 요청을 거부한다
          - {FromPort: 22, ToPort: 22, Protocol: tcp, Cidrs: ["0.0.0.0/0"]}
          - {FromPort: 80, ToPort: 80, Protocol: tcp, Cidrs: ["0.0.0.0/0"]}
      AddOns:
        # 매일 04:00 KST 디스크 스냅샷 (DB 백업 겸용, 최근 7개 보관)
        - AddOnType: AutoSnapshot
          Status: Enabled
          AutoSnapshotAddOnRequest: {SnapshotTimeOfDay: "19:00"}
      UserData: |
        #!/bin/bash
        set -eux
        # 메모리 2GB 에 JVM + PostgreSQL 을 같이 올리므로 스왑을 둔다
        fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y docker.io docker-compose-v2 unattended-upgrades
        usermod -aG docker ubuntu
        install -d -o ubuntu -g ubuntu -m 750 /opt/app
        touch /opt/app/.server-ready

  StaticIp:
    Type: AWS::Lightsail::StaticIp
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      StaticIpName: !Sub "${Name}-ip"
      AttachedTo: !Ref Instance

  # CloudFront 만 아는 값. 서버 프록시가 이 헤더가 없는 요청(서버 IP 직접 접속)을 거부한다
  OriginSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${Name}/origin-secret"
      Description: CloudFront -> 서버 요청 확인용 헤더 값
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  # ── FE 정적 파일 ───────────────────────────────────────────────────────
  FeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]

  FeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FeBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub "${FeBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt FeBucket.Arn, !Sub "${FeBucket.Arn}/*"]
            Condition:
              Bool: {aws:SecureTransport: "false"}

  FeOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${Name}-fe"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # SPA 경로(/app, /site): 확장자가 없는 주소는 index.html 을 준다. API(/v1)에는 붙이지 않는다
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${Name}-spa-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: 확장자 없는 경로는 index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var last = request.uri.substring(request.uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  # 화면(정적 파일) 응답에 붙이는 보안 헤더. AWS 관리형 정책에는 CSP 가 없어 직접 만든다.
  # CSP 는 운영 빌드를 이 정책 아래에서 전체 흐름(소개 페이지 애니메이션·검색·지도·검토·배치안)으로 돌려 위반 0건을 확인한 값이다.
  #  - script/style/font/connect 는 같은 출처만. 인라인 스크립트·eval 이 없고, 인라인 스타일은 모두 CSSOM 으로 넣어 CSP 대상이 아니다
  #  - img-src 의 두 호스트는 BE 에 브이월드 키가 없을 때 쓰는 대체 타일(OpenStreetMap·Esri). 네이버 지도를 켜면 그 호스트를 더해야 한다
  FeSecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${Name}-fe-security"
        Comment: FE security headers with CSP
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'none'; script-src 'self'; style-src 'self';
              img-src 'self' https://tile.openstreetmap.org https://server.arcgisonline.com;
              font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none';
              frame-ancestors 'none'; upgrade-insecure-requests
          StrictTransportSecurity: {Override: true, AccessControlMaxAgeSec: 31536000, IncludeSubdomains: false, Preload: false}
          ContentTypeOptions: {Override: true}
          FrameOptions: {Override: true, FrameOption: DENY}
          ReferrerPolicy: {Override: true, ReferrerPolicy: strict-origin-when-cross-origin}
        CustomHeadersConfig:
          Items:
            - {Header: Permissions-Policy, Value: "geolocation=(self), camera=(), microphone=(), payment=()", Override: true}
            - {Header: Cross-Origin-Opener-Policy, Value: same-origin, Override: true}
        RemoveHeadersConfig:
          Items:
            - {Header: Server} # 원본이 S3 임을 알리는 헤더를 지운다

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${Name} (FE + /v1 API)"
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200 # 한국 엣지 포함
        DefaultRootObject: index.html
        Origins:
          - Id: fe
            DomainName: !GetAtt FeBucket.RegionalDomainName
            OriginAccessControlId: !Ref FeOriginAccessControl
            S3OriginConfig: {OriginAccessIdentity: ""}
          - Id: api
            # CloudFront 는 IP 를 원본으로 받지 않으므로 고정 IP 의 AWS 공개 DNS 이름을 쓴다
            DomainName: !Join
              - ""
              - - "ec2-"
                - !Join ["-", !Split [".", !GetAtt StaticIp.IpAddress]]
                - !Sub ".${AWS::Region}.compute.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 30
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Sub "{{resolve:secretsmanager:${OriginSecret}:SecretString}}"
        DefaultCacheBehavior:
          TargetOriginId: fe
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref FeSecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # 배경지도 타일: 엣지에서 캐시해 작은 서버가 타일마다 불리지 않게 한다. /v1/* 보다 먼저 와야 한다 (위에서부터 처음 맞는 것이 적용).
          # CachingOptimized = 캐시 키가 경로뿐(질의·헤더·쿠키 제외)이고 원본의 Cache-Control(max-age=86400)을 따른다.
          # 원본 요청 정책이 없어 뷰어 헤더는 넘기지 않지만, X-Origin-Verify 는 원본(api)에 붙인 헤더라 그대로 간다.
          - PathPattern: "/v1/map/tiles/*"
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          - PathPattern: "/v1/*"
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

  # ── GitHub Actions 가 FE 를 올릴 때 쓰는 역할 (장기 키 없이 OIDC) ───────
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  FeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Name}-fe-deploy"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !If
                  - DefaultSubPrefix
                  - !Sub "repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}"
                  - !Sub "${GitHubSubPrefix}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: fe-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt FeBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${FeBucket.Arn}/*"
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ── 비용 알림 (선택) ───────────────────────────────────────────────────
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: CreateBudget
    Properties:
      Budget:
        BudgetName: !Sub "${Name}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref BudgetLimitUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]

Outputs:
  SiteUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  ServerIp:
    Value: !GetAtt StaticIp.IpAddress
  FeBucketName:
    Value: !Ref FeBucket
  DistributionId:
    Value: !Ref Distribution
  OriginSecretArn:
    Value: !Ref OriginSecret
  FeDeployRoleArn:
    Value: !GetAtt FeDeployRole.Arn
