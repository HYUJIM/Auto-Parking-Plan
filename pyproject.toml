[project]
name = "autoparkingplan"
version = "0.1.0"
description = "APP(Auto Parking Plan) 법규 서버 — 주소 기반 토지·법규 초기검토 및 주차장 배치 시뮬레이션 백엔드"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "shapely>=2.0.4",
  "numpy>=1.26",
  "pyproj>=3.6",
  "jsonschema>=4.22",
  "referencing>=0.35",
  "beautifulsoup4>=4.12",
  "pypdf>=6.10",
  "anthropic>=0.40",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
aws = ["boto3>=1.34"]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
app-cli = "app.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "mockserver*"]

[tool.setuptools.package-data]
app = ["resources/schemas/*.json", "resources/prompts/*.md"]
mockserver = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: 통합 테스트 (로컬 mock 서버/DB 사용)",
  "real_api: 실제 외부 API 키가 필요한 테스트 (기본 skip)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 설계서와 함께 전달된 검증기 원본(tools/)을 그대로 이식한 파일 — 원본과 대조하기 쉽도록 스타일을 바꾸지 않는다
"app/verification/*" = ["F541", "UP017"]
"tests/unit/test_post_verifier.py" = ["E731", "I001"]
