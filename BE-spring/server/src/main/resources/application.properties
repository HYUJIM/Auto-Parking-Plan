# APP 법규 서버 (스프링판) 기본 설정. 운영 값은 환경변수(파이썬판과 같은 이름: DATABASE_URL, ADMIN_TOKEN …)로 준다.
spring.application.name=autoparkingplan
spring.main.banner-mode=off

# 앞단 프록시가 보낸 X-Forwarded-For 로 연결 주소를 바꾸지 않는다 (실제 클라이언트 IP 는 TRUSTED_PROXY_HOPS 로 판별)
server.forward-headers-strategy=none
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-swallow-size=2MB
spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=false
spring.servlet.multipart.enabled=false

# JPA: 스키마는 Flyway 가 만들고 Hibernate 는 엔티티와 맞는지만 확인한다
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.type.json_format_mapper=com.autoparkingplan.db.support.Jackson3JsonFormatMapper
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration/{vendor}
# 파이썬판이 만든 기존 PostgreSQL 스키마(Flyway 기록 없음)는 V1 로 간주하고 그대로 쓴다
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# API 문서 (운영에서는 끈다: ENABLE_DOCS / APP_ENV=prod → 시작 시 덮어씀)
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
springdoc.packages-to-scan=com.autoparkingplan.server.api
